<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TagThemAll Bot</title>
    <link rel="stylesheet" href="css/admin-login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/jpg" href="images/Zufamoa.jpg"/>
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <!-- Admin Login Container -->
    <div class="admin-login-container">
        <div class="admin-login-card">
            <!-- Header -->
            <div class="admin-header">
                <div class="admin-logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>Admin Access</h1>
                <p>Secure administrative portal</p>
            </div>

            <!-- Login Form -->
            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="adminEmail">Administrator Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-shield input-icon"></i>
                        <input 
                            type="email" 
                            id="adminEmail" 
                            name="email" 
                            placeholder="Enter admin email"
                            required
                            autocomplete="username"
                        >
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="adminPassword" 
                            name="password" 
                            placeholder="Enter admin password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <!-- Remember Me -->
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkmark"></span>
                        Remember this device
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="admin-login-btn" id="adminLoginBtn">
                    <span class="btn-text">Access Admin Panel</span>
                    <div class="btn-loader" id="btnLoader">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </button>
            </form>

            <!-- Footer -->
            <div class="admin-footer">
                <p><i class="fas fa-info-circle"></i> Authorized personnel only</p>
                <p class="security-notice">
                    <i class="fas fa-shield-check"></i>
                    This is a secure area. All access attempts are logged.
                </p>
            </div>
        </div>
    </div>

    <!-- Notification System -->
    <div id="notification" class="notification">
        <div class="notification-content">
            <i class="notification-icon"></i>
            <span class="notification-message"></span>
        </div>
        <button class="notification-close">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-shield-alt fa-spin"></i>
            <p>Authenticating...</p>
        </div>
    </div>

    <script src="js/admin-login.js"></script>
</body>
</html>
