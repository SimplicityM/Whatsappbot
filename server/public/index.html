<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TagThemAll Bot</title>
    <link rel="icon" type="image/jpg" href="images/Zufamoa.jpg"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-container {
            text-align: center;
            color: white;
            animation: fadeInUp 1s ease-out;
        }

        .logo-container {
            margin-bottom: 2rem;
            animation: scaleIn 0.8s ease-out;
        }

        .logo-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        .welcome-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 3rem;
            opacity: 0.9;
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #fff, #f0f0f0);
            border-radius: 10px;
            animation: loading 2.5s ease-in-out forwards;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .tagline {
            margin-top: 2rem;
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes loading {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-title {
                font-size: 2rem;
            }
            .welcome-subtitle {
                font-size: 1.2rem;
            }
            .logo-icon {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container" id="welcomeContainer">
        <div class="logo-container">
            <div class="logo-icon">🤖</div>  
            <!-- <img src="images/Zufamoa.jpg" alt="Logo" style="width: 100px; height: 100px; border-radius: 50%;"> -->
            <h1 class="welcome-title">TagThemAll Bot</h1>
            <p class="welcome-subtitle">WhatsApp Automation Made Easy</p>
        </div>
        
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        
        <p class="tagline">Revolutionizing Group Management & Communication</p>
    </div>

    <script>
        // Redirect to main page after animation completes
        setTimeout(() => {
            document.getElementById('welcomeContainer').classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 500);
        }, 10000); // 10 seconds total (2.5s loading + 0.5s buffer)
    </script>
</body>
</html>
