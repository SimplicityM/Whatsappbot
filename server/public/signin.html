<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | TagThemAll Bot</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="icon" type="image/jpg" href="images/Zufamoa.jpg"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-robot"></i>
                TagThemAll Bot
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="signin.html" class="active">Sign In</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="signup-container">
            <div class="signup-card">
                <div class="card-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to your TagThemAll Bot account</p>
                </div>

                <form id="signinForm" class="signup-form" novalidate>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="link forgot-password-link" id="forgotPasswordLink">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary" id="submitBtn">
                        <span class="btn-text">Sign In</span>
                        <div class="btn-loader" id="btnLoader">
                            <div class="spinner"></div>
                        </div>
                    </button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-login">
                    <div id="g_id_onload"
                         data-client_id="1024040438272-d9emfus837hjp2oc7afvcoq11p7p1qpg.apps.googleusercontent.com"
                         data-callback="handleCredentialResponse"
                         data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin google-btn" 
                         data-type="standard" 
                         data-size="large" 
                         data-theme="outline" 
                         data-text="signin_with"
                         data-shape="rectangular"
                         data-logo_alignment="left">
                    </div>
                </div>

                <div class="login-link">
                    Don't have an account? <a href="signup.html" class="link">Sign up here</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reset Password</h2>
                <button type="button" class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="forgotPasswordForm" class="modal-form">
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="resetEmail" name="resetEmail" placeholder="Enter your email" required>
                    </div>
                    <span class="error-message" id="resetEmailError"></span>
                </div>
                <button type="submit" class="btn-primary" id="resetSubmitBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <div class="btn-loader" id="resetBtnLoader">
                        <div class="spinner"></div>
                    </div>
                </button>
            </form>
        </div>
    </div>

   <!-- GOOGLE ONE TAP CALLBACK -->
<script>
window.handleCredentialResponse = function (response) {
    fetch("https://whatsappbot-u5yq.onrender.com/api/auth/google-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: response.credential })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            localStorage.setItem("userSession", JSON.stringify(data.data));
            showNotification("Google sign-in successful!", "success");
            setTimeout(() => (window.location.href = "/dashboard"), 1500);
        } else {
            showNotification(data.message || "Google login failed", "error");
        }
    })
    .catch(() => showNotification("Network error. Try again.", "error"));
};
</script>

<!-- MAIN SCRIPT -->
<script>
document.addEventListener('DOMContentLoaded', function() {

    // ============================= ELEMENTS =============================
    const form = document.getElementById('signinForm');
    const password = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const submitBtn = document.getElementById('submitBtn');
    const btnLoader = document.getElementById('btnLoader');
    const btnText = document.querySelector('.btn-text');

    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const modalClose = document.getElementById('modalClose');

    // Hide forgot modal initially
    forgotPasswordModal.style.display = "none";


    // ============================= MOBILE NAV =============================
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');

    hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('active');
    });


    // ============================= PASSWORD TOGGLE =============================
    togglePassword.addEventListener('click', function() {
        const type = password.type === "password" ? "text" : "password";
        password.type = type;

        const icon = this.querySelector("i");
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
    });


    // ============================= OPEN / CLOSE FORGOT PASSWORD MODAL =============================
    forgotPasswordLink.addEventListener('click', (e) => {
        e.preventDefault();
        forgotPasswordModal.style.display = "flex";
    });

    modalClose.addEventListener('click', () => forgotPasswordModal.style.display = "none");

    forgotPasswordModal.addEventListener('click', (e) => {
        if (e.target === forgotPasswordModal) forgotPasswordModal.style.display = "none";
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") forgotPasswordModal.style.display = "none";
    });


    // ============================= VALIDATION =============================
    function validateForm() {
        let valid = true;
        const email = document.getElementById("email").value.trim();
        const pwd = password.value;

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showError("emailError", "Enter a valid email");
            valid = false;
        } else clearError("emailError");

        if (!pwd.length) {
            showError("passwordError", "Password is required");
            valid = false;
        } else clearError("passwordError");

        return valid;
    }


    // ============================= LOGIN HANDLER =============================
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!validateForm()) return;

        submitBtn.disabled = true;
        btnText.style.opacity = "0";
        btnLoader.style.display = "block";

        // RUN RECAPTCHA FIRST
        grecaptcha.ready(function() {
            grecaptcha.execute("6Lf5IhssAAAAAMoASoArAe7UTvpqxJDxswRrEnlo", { action: "login" })
            .then(async function(token) {

                try {
                    const res = await fetch("https://whatsappbot-u5yq.onrender.com/api/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            email: document.getElementById("email").value.trim(),
                            password: document.getElementById("password").value,
                            recaptchaToken: token
                        })
                    });

                    const data = await res.json();

                    if (data.success) {
                        localStorage.setItem("userSession", JSON.stringify({
                            token: data.data.token,
                            user: data.data.user
                        }));

                        showNotification("Login successful! Redirecting...", "success");
                        setTimeout(() => window.location.href = "/dashboard", 1500);
                    } else {
                        showNotification(data.message || "Invalid login", "error");
                    }

                } catch (err) {
                    showNotification("Network error. Try again.", "error");
                }

                submitBtn.disabled = false;
                btnText.style.opacity = "1";
                btnLoader.style.display = "none";
            });
        });
    });



    // ============================= FORGOT PASSWORD HANDLER =============================
    forgotPasswordForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById("resetEmail").value.trim();
        const resetBtn = document.getElementById("resetSubmitBtn");
        const resetLoader = document.getElementById("resetBtnLoader");
        const resetText = resetBtn.querySelector(".btn-text");

        resetBtn.disabled = true;
        resetText.style.opacity = "0";
        resetLoader.style.display = "block";

        grecaptcha.ready(() => {
            grecaptcha.execute("6Lf5IhssAAAAAMoASoArAe7UTvpqxJDxswRrEnlo", { action: "forgot_password" })
            .then(async (token) => {

                try {
                    const res = await fetch("https://whatsappbot-u5yq.onrender.com/api/auth/forgot-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, recaptchaToken: token })
                    });

                    const data = await res.json();

                    if (data.success) {
                        showNotification("Password reset link sent!", "success");
                        forgotPasswordModal.style.display = "none";
                    } else {
                        showNotification(data.message || "Error sending reset email", "error");
                    }
                } catch (err) {
                    showNotification("Network error. Try again.", "error");
                }

                resetBtn.disabled = false;
                resetText.style.opacity = "1";
                resetLoader.style.display = "none";
            });
        });
    });




    // ============================= NOTIFICATION =============================
    function showNotification(message, type="info") {
        document.querySelectorAll(".custom-notification").forEach(n => n.remove());

        const n = document.createElement("div");
        n.className = `custom-notification ${type}`;
        n.innerHTML = `
            <div class="notification-content">
                <i class="fas fa-${type === "success" ? "check-circle" : "exclamation-circle"}"></i>
                <span>${message}</span>
            </div>
            <button class="notification-close" onclick="this.parentElement.remove()">
                <i class="fas fa-times"></i>
            </button>
        `;

        document.body.appendChild(n);
        setTimeout(() => n.remove(), 5000);
    }

});
</script>
</body>
</html>
