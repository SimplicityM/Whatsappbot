apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagthemall-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tagthemall
  template:
    metadata:
      labels:
        app: tagthemall
    spec:
      containers:
        - name: worker
          image: tagthemall:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: tagthemall-secrets
                  key: mongodb_uri
            - name: REDIS_URL
              value: redis://redis-service:6379
---
apiVersion: v1
kind: Service
metadata:
  name: tagthemall-service
spec:
  type: LoadBalancer
  selector:
    app: tagthemall
  ports:
    - port: 80
      targetPort: 3000